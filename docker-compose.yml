# MySQL local para desarrollo:  docker compose up -d
# Luego en .env: DB_HOST=127.0.0.1  DB_USER=fitpulse  DB_PASSWORD=fitpulse  DB_NAME=fitpulse
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitpulse
      MYSQL_USER: fitpulse
      MYSQL_PASSWORD: fitpulse
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  mysqldata:
