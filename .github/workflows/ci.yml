# Prácticas 13 y 14 · Integración continua de la API FitPulse (Node.js + Express + MariaDB).
#
# En cada push, pull request o a mano: levanta una MariaDB temporal, instala dependencias
# con npm ci y ejecuta todas las pruebas automatizadas (tests/*.test.js):
#   api.test.js        flujo de la API
#   whitebox.test.js   caminos de login, sesiones y reportes (P11)
#   p12.test.js        caché de búsqueda, índice, idempotencia y defectos de la P12
#   p13.test.js        códigos HTTP esperados y persistencia en la base (P13/P14)
# Cada archivo crea y borra su propia base de datos de pruebas.
#
# Runner: self-hosted en la laptop de desarrollo (Windows 11). Los runners de GitHub no
# arrancan para esta cuenta por un bloqueo de facturación; ver la nota en el CI de la app.
name: CI API

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'; exit $LASTEXITCODE"

jobs:
  pruebas:
    name: Pruebas de la API con MariaDB
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: root
      DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - name: Node del runner
        run: node --version

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Revisión de sintaxis
        run: |
          foreach ($f in Get-ChildItem server.js, db.js, routes\*.js, middleware\*.js, services\*.js) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "::error file=$($f.Name)::Error de sintaxis"; exit 1 }
          }
          Write-Host "Sintaxis correcta"

      # MariaDB vive en el mismo paso que las pruebas: en Windows el runner termina al final de
      # cada paso los procesos que ese paso dejó vivos.
      - name: MariaDB temporal + pruebas automatizadas
        run: |
          .\.github\scripts\mariadb-windows.ps1 -Port 3307
          if (-not $?) { exit 1 }
          cmd /c "node --test --test-concurrency=1 --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml tests/*.test.js"
          $code = $LASTEXITCODE
          $pidFile = "$env:RUNNER_TEMP\mariadb.pid"
          if (Test-Path $pidFile) { Stop-Process -Id ([int](Get-Content $pidFile)) -Force -ErrorAction SilentlyContinue }
          exit $code

      - name: Resumen de resultados
        if: always()
        env:
          CI_TITLE: Pruebas de la API (node --test)
        run: node .github/scripts/ci_report.js junit test-results.xml

      - name: Dependencias con vulnerabilidades críticas (informativo)
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # la cuota de artefactos de la cuenta está bloqueada (facturación)
        with:
          name: resultados-api
          path: test-results.xml
          if-no-files-found: ignore
